    <script>
        const img1 = document.getElementById('img1');
        const img2 = document.getElementById('img2');
        const img3 = document.getElementById('img3');
        const textOverlay = document.getElementById('textOverlay');
        const panelsContainer = document.getElementById('panelsContainer');
        const desktopContactPanel = document.getElementById('desktopContactPanel');
        const comboBottomFlower = document.getElementById('comboBottomFlower');
        
        const preloader = document.getElementById('preloader');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        let userScrolled = false;
        let imageSwitchTimeout = null;
        let scrollDownDelayTimeout = null;

        function checkComboFlowerState() {
            if (!comboBottomFlower) return;
            const isDesktop = window.innerWidth >= 1200;
            const isMaximizedWidth = window.innerWidth >= (screen.availWidth - 25);
            const isMaximizedHeight = window.innerHeight >= (screen.availHeight - 90);

            if (isDesktop && isMaximizedWidth && isMaximizedHeight) {
                comboBottomFlower.classList.add('show-fullscreen-flower');
            } else {
                comboBottomFlower.classList.remove('show-fullscreen-flower');
            }
        }

        window.addEventListener('resize', checkComboFlowerState);
        window.addEventListener('DOMContentLoaded', checkComboFlowerState);

        const trackerUrl = 'loading-tracker.png';
        const trackerPreload = new Image();
        trackerPreload.src = trackerUrl;

        const imageUrls = [
            'slide-bg-1.png',
            'slide-bg-2.png',
            'slide-bg-3.png'
        ];

        let loadedImagesCount = 0;
        const totalImages = imageUrls.length;

        function updateProgress(percent) {
            progressBar.style.width = percent + '%';
            progressText.innerText = Math.round(percent) + '%';
        }

        imageUrls.forEach(url => {
            const img = new Image();
            img.src = url;
            
            const handleLoad = () => {
                loadedImagesCount++;
                let currentPercent = (loadedImagesCount / totalImages) * 100;
                updateProgress(currentPercent);

                if (loadedImagesCount === totalImages) {
                    setTimeout(startPageAnimations, 300);
                }
            };

            img.onload = handleLoad;
            img.onerror = handleLoad;
        });

        function startPageAnimations() {
            preloader.classList.add('hide-loader');
            checkComboFlowerState();

            if (window.scrollY === 0 && !userScrolled) {
                img3.classList.add('show-img3');
            }

            setTimeout(() => {
                panelsContainer.classList.add('show-panels');
                desktopContactPanel.classList.add('show-panels');
            }, 800);

            setTimeout(() => {
                if (window.scrollY === 0 && !userScrolled) {
                    img3.style.opacity = '0';
                    img1.style.opacity = '1';
                    img2.style.opacity = '0';
                }
            }, 3200);
        }

        window.addEventListener('scroll', () => {
            userScrolled = true;
            
            if (imageSwitchTimeout) clearTimeout(imageSwitchTimeout);
            if (scrollDownDelayTimeout) clearTimeout(scrollDownDelayTimeout);

            if (window.scrollY > 20) {
                textOverlay.classList.add('hide-text');
                img1.style.opacity = '0';
                img2.style.opacity = '1';

                scrollDownDelayTimeout = setTimeout(() => {
                    if (window.scrollY > 20) {
                        img3.classList.remove('show-img3');
                        img3.style.opacity = '0';
                    }
                }, 500);
            } else {
                textOverlay.classList.remove('hide-text');
                img3.classList.add('show-img3');
                img3.style.opacity = '1';
                
                imageSwitchTimeout = setTimeout(() => {
                    if (window.scrollY <= 20) {
                        img1.style.opacity = '1';
                        img2.style.opacity = '0';
                    }
                }, 2200);
            }
        }, { passive: true });

        // Favicon Rotation
        const favicon = document.getElementById('favicon');
        if (window.location.protocol.startsWith('http')) {
            const faviconImg = new Image();
            faviconImg.src = 'share-banner.png';

            const faviconCanvas = document.createElement('canvas');
            const faviconCtx = faviconCanvas.getContext('2d');
            faviconCanvas.width = 32;
            faviconCanvas.height = 32;

            function rotateFavicon(direction = 'clockwise') {
                let step = direction === 'clockwise' ? 10 : -10;
                let maxAngle = 360;
                let currentAngle = 0;

                const interval = setInterval(() => {
                    try {
                        faviconCtx.clearRect(0, 0, 32, 32);
                        faviconCtx.save();
                        faviconCtx.translate(16, 16);
                        faviconCtx.rotate((currentAngle * Math.PI) / 180);
                        faviconCtx.drawImage(faviconImg, -16, -16, 32, 32);
                        faviconCtx.restore();
                        favicon.href = faviconCanvas.toDataURL('image/png');
                    } catch (err) {
                        clearInterval(interval);
                        return;
                    }

                    currentAngle += step;
                    if (Math.abs(currentAngle) > maxAngle) clearInterval(interval);
                }, 25);
            }

            faviconImg.onload = () => rotateFavicon('clockwise');
            window.addEventListener('pageshow', (event) => {
                if (event.persisted) rotateFavicon('anticlockwise');
            });
            document.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => rotateFavicon('clockwise'));
            });
        }

        /* ----------------------------------------------------
           🌟 FRONT VIEW 3D FLOATING SLIDER 🌟
        ---------------------------------------------------- */
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-JpfJU07YM3ZE5KnskBgwZqFZ6ppb1HmsDf784_bhf39CkHiVMiNjHOmbtbXrQGbQ-A/exec";

        function formatImageUrl(url) {
            if (!url) return "";
            const driveMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (driveMatch && driveMatch[1]) {
                return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
            }
            return url;
        }

        class SuperFastFloatingSlider {
            constructor(containerId, wrapperId, autoPlayDelay = 3000) {
                this.container = document.getElementById(containerId);
                this.wrapper = document.getElementById(wrapperId);
                this.autoPlayDelay = autoPlayDelay;
                this.currentIndex = 0;
                this.cards = [];
                this.totalCards = 0;
                this.timer = null;
                this.startX = 0;
                this.isDragging = false;
                this.isInitialized = false;
                this.initTouchEvents();
            }

            loadProgressively(items) {
                this.stopAutoPlay();
                this.container.innerHTML = "";
                this.cards = [];
                this.totalCards = items.length;

                if (this.totalCards === 0) {
                    this.wrapper.classList.remove('is-ready');
                    return;
                }

                const firstUrl = formatImageUrl(items[0].url);
                const firstImg = new Image();
                firstImg.src = firstUrl;

                const startDeck = () => {
                    if (this.isInitialized) return;
                    this.isInitialized = true;

                    items.forEach((item, index) => {
                        const card = document.createElement("div");
                        card.className = "card-item";
                        const imgUrl = formatImageUrl(item.url);
                        
                        const isHighPriority = index <= 1;
                        card.innerHTML = `<img src="${imgUrl}" alt="Front View #${index + 1}" ${isHighPriority ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" onerror="this.parentElement.remove()">`;
                        this.container.appendChild(card);
                        this.cards.push(card);
                    });

                    this.wrapper.classList.add('is-ready');
                    this.currentIndex = 0;
                    this.updateDeckPositions();
                    this.startAutoPlay();
                };

                firstImg.onload = startDeck;
                firstImg.onerror = startDeck;
                setTimeout(startDeck, 600);
            }

            updateDeckPositions() {
                if (this.totalCards === 0) return;

                this.cards.forEach((card, i) => {
                    card.classList.remove('is-center', 'is-left', 'is-right', 'is-hidden');

                    if (this.totalCards === 1) {
                        card.classList.add('is-center');
                        return;
                    }

                    if (this.totalCards === 2) {
                        if (i === this.currentIndex) card.classList.add('is-center');
                        else card.classList.add('is-right');
                        return;
                    }

                    let diff = (i - this.currentIndex) % this.totalCards;
                    if (diff < 0) diff += this.totalCards;

                    if (diff === 0) {
                        card.classList.add('is-center');
                    } else if (diff === 1) {
                        card.classList.add('is-right');
                    } else if (diff === this.totalCards - 1) {
                        card.classList.add('is-left');
                    } else {
                        card.classList.add('is-hidden');
                    }
                });
            }

            next() {
                if (this.totalCards <= 1) return;
                this.currentIndex = (this.currentIndex + 1) % this.totalCards;
                this.updateDeckPositions();
            }

            prev() {
                if (this.totalCards <= 1) return;
                this.currentIndex = (this.currentIndex - 1 + this.totalCards) % this.totalCards;
                this.updateDeckPositions();
            }

            initTouchEvents() {
                this.container.addEventListener('touchstart', (e) => {
                    this.startX = e.touches[0].clientX;
                    this.isDragging = true;
                    this.stopAutoPlay();
                }, { passive: true });

                this.container.addEventListener('touchend', (e) => {
                    if (!this.isDragging) return;
                    this.isDragging = false;
                    const diff = e.changedTouches[0].clientX - this.startX;
                    if (diff < -30) this.next();
                    else if (diff > 30) this.prev();
                    this.startAutoPlay();
                });

                this.container.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    this.startX = e.clientX;
                    this.isDragging = true;
                    this.stopAutoPlay();
                });

                this.container.addEventListener('mouseup', (e) => {
                    if (!this.isDragging) return;
                    this.isDragging = false;
                    const diff = e.clientX - this.startX;
                    if (diff < -30) this.next();
                    else if (diff > 30) this.prev();
                    this.startAutoPlay();
                });

                this.container.addEventListener('mouseleave', () => {
                    if (this.isDragging) {
                        this.isDragging = false;
                        this.startAutoPlay();
                    }
                });
            }

            startAutoPlay() {
                if (this.totalCards <= 1) return;
                this.stopAutoPlay();
                this.timer = setInterval(() => this.next(), this.autoPlayDelay);
            }

            stopAutoPlay() {
                if (this.timer) clearInterval(this.timer);
            }
        }

        const frontViewSlider = new SuperFastFloatingSlider("frontview-deck", "frontviewWrapper", 3000);
        let lastDeckHash = "";

        async function fetchFrontViewImages() {
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();

                const frontViewItems = data.filter(item => {
                    const tag = (item.tags || "").toLowerCase();
                    return tag.includes("front view") || tag.includes("frontview") || tag.includes("front_view");
                });

                const newHash = JSON.stringify(frontViewItems.map(i => i.url || i.id));
                if (newHash === lastDeckHash) return;
                lastDeckHash = newHash;

                if (frontViewItems.length > 0) {
                    frontViewSlider.loadProgressively(frontViewItems);
                }
            } catch (err) {
                console.error("Slider fetch error:", err);
            }
        }

        fetchFrontViewImages();
        setInterval(fetchFrontViewImages, 15000);
    </script>
</body>
</html>
